# 시크릿은 이 파일에 직접 쓰지 마세요.
# 호스트 환경변수 / CI Secrets / .env(로컬 전용, git 제외)에서 주입합니다.
#
# 실행 예:
#   set PORTONE_API_SECRET=...   (Windows)
#   export PORTONE_API_SECRET=... (Linux/macOS)
#   docker compose up --build

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_API_BASE_URL: ${PORTONE_API_BASE_URL:-https://api.portone.io}
      PORTONE_ALLOWED_CHANNEL_TYPE: LIVE
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PAYMENT_TEST_ORDER_NAME: ${PAYMENT_TEST_ORDER_NAME:-포트원 테스트 상품}
      PAYMENT_TEST_AMOUNT: ${PAYMENT_TEST_AMOUNT:-1000}
      PAYMENT_TEST_CURRENCY: ${PAYMENT_TEST_CURRENCY:-CURRENCY_KRW}
      PAYMENT_TEST_PAY_METHOD: ${PAYMENT_TEST_PAY_METHOD:-CARD}
      PAYMENT_TEST_CUSTOMER_NAME: ${PAYMENT_TEST_CUSTOMER_NAME:-테스트구매자}
      PAYMENT_TEST_CUSTOMER_PHONE: ${PAYMENT_TEST_CUSTOMER_PHONE:-01012345678}
      PAYMENT_TEST_CUSTOMER_EMAIL: ${PAYMENT_TEST_CUSTOMER_EMAIL:-test@example.com}
    # 로컬에서만 임시로 쓸 경우. 운영에서는 사용하지 말 것.
    # env_file:
    #   - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
