spring:
  application:
    name: payment-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

portone:
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  # 테스트/운영 채널을 환경별로 분리해 잘못된 환경 결제를 차단한다.
  allowed-channel-type: ${PORTONE_ALLOWED_CHANNEL_TYPE:TEST}

payment:
  test:
    order-name: ${PAYMENT_TEST_ORDER_NAME:포트원 테스트 상품}
    amount: ${PAYMENT_TEST_AMOUNT:1000}
    currency: ${PAYMENT_TEST_CURRENCY:CURRENCY_KRW}
    pay-method: ${PAYMENT_TEST_PAY_METHOD:CARD}
    customer:
      full-name: ${PAYMENT_TEST_CUSTOMER_NAME:테스트구매자}
      phone-number: ${PAYMENT_TEST_CUSTOMER_PHONE:01012345678}
      email: ${PAYMENT_TEST_CUSTOMER_EMAIL:test@example.com}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
