spring:
  config:
    activate:
      on-profile: prod
  # 운영에서는 로컬 .env 파일을 읽지 않는다. AWS/Docker/GitHub Secrets 등 외부 주입만 허용한다.
  dotenv:
    enabled: false

portone:
  # 기본값 없음 → 환경변수 미주입 시 기동 실패
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  allowed-channel-type: LIVE

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
