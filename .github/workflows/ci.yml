name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # 공개값만. 시크릿은 빌드에 넣지 않는다.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
        env:
          # 테스트용 더미 값. 실제 운영 키는 GitHub Secrets에만 저장한다.
          SPRING_PROFILES_ACTIVE: test
          PORTONE_API_SECRET: ci-dummy-portone-api-secret-value
          PORTONE_STORE_ID: store-00000000-0000-0000-0000-000000000000
          PORTONE_CHANNEL_KEY: channel-key-00000000-0000-0000-0000-000000000000
          PORTONE_BILLING_CHANNEL_KEY: channel-key-11111111-1111-1111-1111-111111111111
